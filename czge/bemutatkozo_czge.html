<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bemutatkozás</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #222;
        }

        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        main {
            width: 80%;
            max-width: 900px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #cccccc;
        }

        h2 {
            color: #2c3e50;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
        }

        .kep {
            text-align: center;
            margin-top: 25px;
        }

        .kep img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .vissza {
            text-align: right;
            margin-top: 40px;
        }

        .vissza a {
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
        }

        .vissza a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bemutatkozás</h1>
    </header>

    <main>
        <p><strong>Név:</strong> Czimbó Gergő</p>
        <p><strong>Hobby:</strong> Főzés</p>
        <p><strong>Kedvenc sport:</strong> Tollaslabda</p>

        <h2>Kedvenc állatom: Kutya</h2>
        
        <div class="kep">
            <img src="tacsko.jpg" alt="Kedvenc állat">
        </div>
        <p>Ez a kedvenc állatom, mert ilyen kutyám van</p>

        <div class="vissza">
            <a href="index.html">Vissza a nyitóoldalra</a>
        </div>
    </main>

</body>
</html>
